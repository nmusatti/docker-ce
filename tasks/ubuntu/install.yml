---
# docker-ce
# Copyright Nicola Musatti 2021 - 2026.

- name: Update the apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Remove Ubuntu distributed Docker
  ansible.builtin.apt:
    name:
      - docker
      - docker-engine
      - docker.io
      - containerd
      - runc
    state: absent
  become: true

- name: "Install the required packages"
  ansible.builtin.apt:
    name:
      - ca-certificates
      # Needed by deb822_repository
      - python3-debian
  become: true

# Versions up to 1.3 used a one-line source with a key in /usr/share/keyrings.
# apt refuses a second source for the same repository with a different key.
- name: Remove the old Docker apt repository and key
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/docker.list
    - /usr/share/keyrings/docker-archive-keyring.gpg
  become: true

- name: Install the official Docker repository
  ansible.builtin.deb822_repository:
    name: docker
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_distribution_release }}"
    components: stable
    signed_by: https://download.docker.com/linux/ubuntu/gpg
  register: docker_repo
  become: true

# Not a handler: the cache must be updated before the next task
- name: Update the apt cache after adding the repository  # noqa: no-handler
  ansible.builtin.apt:
    update_cache: true
  become: true
  when: docker_repo is changed

- name: "Install Docker and dependencies"
  ansible.builtin.apt:
    name:
      - containerd.io
      - docker-ce
      - docker-ce-cli
      - docker-buildx-plugin
      - docker-compose-plugin
  become: true
