---
# docker-ce
# Copyright Nicola Musatti 2026.

# Base configuration shared by all the scenarios in molecule/.
# The target distribution is selected with the MOLECULE_DISTRO environment variable;
# see molecule/Dockerfile.j2 for the supported values.

dependency:
  name: galaxy
  enabled: false  # the role has no dependencies

driver:
  name: podman

platforms:
  - name: docker-ce-${MOLECULE_SCENARIO_NAME}-${MOLECULE_DISTRO:-rockylinux10}
    image: docker-ce-${MOLECULE_DISTRO:-rockylinux10}
    dockerfile: ../Dockerfile.j2
    pre_build_image: false
    systemd: always
    command: /sbin/init
    privileged: true

provisioner:
  name: ansible

verifier:
  name: testinfra

scenario:
  test_sequence:
    - destroy
    - syntax
    - create
    - converge
    - idempotence
    - verify
    - destroy
